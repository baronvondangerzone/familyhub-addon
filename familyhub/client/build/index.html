<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="theme-color" content="#0f1117"/>
<title>Family Hub 🏠</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0f1117;--bg2:#171a24;--bg3:#1e2130;--border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.13);--text:#e8eaf0;--muted:#7b829a;--accent:#6c8eff;--green:#34d399;--amber:#fbbf24;--red:#f87171;--pink:#f472b6;--radius:12px;--radius-sm:8px}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:14px}
.app{display:flex;height:100vh;overflow:hidden}
.sidebar{width:220px;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0}
.logo{padding:18px 20px;font-size:16px;font-weight:700;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border)}
.logo-icon{width:32px;height:32px;background:linear-gradient(135deg,var(--accent),#8b5cf6);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:15px}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 20px;cursor:pointer;font-size:13.5px;color:var(--muted);border-left:3px solid transparent;transition:all .15s}
.nav-item:hover{color:var(--text);background:rgba(255,255,255,0.03)}
.nav-item.active{color:var(--accent);background:rgba(108,142,255,0.09);border-left-color:var(--accent)}
.nav-badge{margin-left:auto;background:rgba(248,113,113,0.2);color:var(--red);font-size:10px;font-weight:700;padding:1px 6px;border-radius:100px}
.main{flex:1;overflow-y:auto}
.page{padding:28px;max-width:900px}
.page-title{font-size:22px;font-weight:700;letter-spacing:-.5px;margin-bottom:4px}
.page-sub{color:var(--muted);font-size:13px;margin-bottom:24px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px}
.stat{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:14px 18px}
.stat-label{font-size:11px;color:var(--muted);margin-bottom:5px;text-transform:uppercase;letter-spacing:.5px}
.stat-value{font-size:26px;font-weight:700}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;margin-bottom:14px}
.card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.card-title{font-size:14px;font-weight:600}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:var(--radius-sm);font-size:13px;font-weight:500;cursor:pointer;border:none;transition:all .15s}
.btn-primary{background:var(--accent);color:#fff}.btn-primary:hover{background:#5a7eef}
.btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--border2)}.btn-ghost:hover{color:var(--text)}
.btn-danger{background:rgba(248,113,113,0.1);color:var(--red);border:1px solid rgba(248,113,113,0.2)}
.btn-sm{padding:5px 10px;font-size:12px}
input,select,textarea{background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius-sm);color:var(--text);padding:8px 11px;font-size:13.5px;font-family:inherit;outline:none;transition:border-color .15s;width:100%}
input:focus,select:focus{border-color:var(--accent)}
input::placeholder{color:var(--muted)}
select option{background:var(--bg2)}
.form-group{display:flex;flex-direction:column;gap:5px}
.form-label{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:100px;font-size:11px;font-weight:700;text-transform:uppercase}
.badge-p1{background:rgba(248,113,113,0.15);color:#f87171;border:1px solid rgba(248,113,113,0.25)}
.badge-p2{background:rgba(251,191,36,0.15);color:#fbbf24;border:1px solid rgba(251,191,36,0.25)}
.badge-p3{background:rgba(52,211,153,0.15);color:#34d399;border:1px solid rgba(52,211,153,0.25)}
.badge-p4{background:rgba(123,130,154,0.12);color:#7b829a;border:1px solid rgba(123,130,154,0.2)}
.avatar{border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0}
.empty{text-align:center;padding:48px 20px;color:var(--muted)}
.empty-icon{font-size:40px;margin-bottom:12px;opacity:.3}
.spinner{width:20px;height:20px;border:2px solid var(--border2);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:#252840;border-radius:3px}
@media(max-width:640px){.sidebar{display:none}.page{padding:16px}.stats{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useRef,useCallback}=React;
const BASE='';
async function req(method,path,body){
  const res=await fetch(`${BASE}/api${path}`,{method,headers:body?{'Content-Type':'application/json'}:{},body:body?JSON.stringify(body):undefined});
  if(!res.ok)throw new Error(`${method} ${path} ${res.status}`);
  return res.json();
}
const api={
  getMembers:()=>req('GET','/members'),
  addMember:(d)=>req('POST','/members',d),
  deleteMember:(id)=>req('DELETE',`/members/${id}`),
  getShopping:()=>req('GET','/shopping'),
  addShoppingItem:(d)=>req('POST','/shopping',d),
  updateShoppingItem:(id,d)=>req('PUT',`/shopping/${id}`,d),
  toggleShoppingItem:(id)=>req('PATCH',`/shopping/${id}/toggle`),
  deleteShoppingItem:(id)=>req('DELETE',`/shopping/${id}`),
  clearDoneItems:()=>req('DELETE','/shopping/done/all'),
  getMessages:(l=50)=>req('GET',`/messages?limit=${l}`),
  postMessage:(d)=>req('POST','/messages',d),
  getMessagesSince:(id)=>req('GET',`/messages/since/${id}`),
  getEvents:(f,t)=>req('GET',`/events${f?`?from=${f}&to=${t}`:''}`),
  addEvent:(d)=>req('POST','/events',d),
  deleteEvent:(id)=>req('DELETE',`/events/${id}`),
  getSettings:()=>req('GET','/settings'),
  saveSettings:(d)=>req('POST','/settings',d),
};

function Av({member,size=28}){
  if(!member)return null;
  return <div className="avatar" style={{width:size,height:size,background:member.color+'25',color:member.color,border:`1.5px solid ${member.color}40`,fontSize:size*.35}}>{member.initials}</div>;
}

function Shopping({members}){
  const [items,setItems]=useState([]);
  const [loading,setLoading]=useState(true);
  const [showForm,setShowForm]=useState(false);
  const [filter,setFilter]=useState('all');
  const [saving,setSaving]=useState(false);
  const empty={name:'',added_by:members[0]?.name||'',priority:'P2',need_by:'',price:'',category:'General',note:''};
  const [form,setForm]=useState(empty);
  const load=useCallback(()=>{api.getShopping().then(d=>{setItems(d);setLoading(false);}).catch(console.error);},[]);
  useEffect(()=>{load();},[load]);
  useEffect(()=>{if(members.length)setForm(f=>({...f,added_by:f.added_by||members[0].name}));},[members]);
  const pending=items.filter(i=>!i.done);
  const total=pending.reduce((s,i)=>s+(parseFloat(i.price)||0),0);
  const p1=pending.filter(i=>i.priority==='P1');
  const filtered=items.filter(i=>{
    if(filter==='done')return i.done;
    if(filter==='pending')return!i.done;
    if(['P1','P2','P3','P4'].includes(filter))return i.priority===filter&&!i.done;
    return true;
  });
  const submit=async()=>{
    if(!form.name.trim())return;
    setSaving(true);
    try{await api.addShoppingItem(form);load();setForm(empty);setShowForm(false);}catch(e){console.error(e);}
    setSaving(false);
  };
  const toggle=async(id)=>{setItems(prev=>prev.map(i=>i.id===id?{...i,done:!i.done}:i));try{await api.toggleShoppingItem(id);load();}catch(e){load();}};
  const del=async(id)=>{setItems(prev=>prev.filter(i=>i.id!==id));try{await api.deleteShoppingItem(id);}catch(e){load();}};
  const getMember=name=>members.find(m=>m.name===name);
  const fmtDate=d=>{if(!d)return null;const dt=new Date(d+'T00:00:00');const today=new Date();today.setHours(0,0,0,0);const diff=Math.round((dt-today)/86400000);if(diff<0)return{label:`${Math.abs(diff)}d overdue`,color:'var(--red)'};if(diff===0)return{label:'Today',color:'var(--amber)'};if(diff===1)return{label:'Tomorrow',color:'var(--amber)'};if(diff<=7)return{label:`${diff} days`,color:'var(--text)'};return{label:dt.toLocaleDateString('en-US',{month:'short',day:'numeric'}),color:'var(--muted)'};};
  const PLABEL={P1:'Urgent',P2:'Soon',P3:'Whenever',P4:'Wishlist'};
  const PCLS={P1:'badge-p1',P2:'badge-p2',P3:'badge-p3',P4:'badge-p4'};
  const CATS=['General','Clothing','Groceries','School','Electronics','Medical','Sports','Household'];
  if(loading)return<div className="page"><div style={{display:'flex',gap:10,alignItems:'center',marginTop:40,color:'var(--muted)'}}><div className="spinner"></div>Loading...</div></div>;
  return(
    <div className="page">
      <div className="page-title">Shopping List</div>
      <div className="page-sub">Family purchase requests — sorted by priority</div>
      <div className="stats">
        <div className="stat"><div className="stat-label">Pending</div><div className="stat-value" style={{color:'var(--accent)'}}>{pending.length}</div></div>
        <div className="stat"><div className="stat-label">Est. Total</div><div className="stat-value" style={{color:'var(--green)'}}>~${total.toFixed(0)}</div></div>
        <div className="stat"><div className="stat-label">Urgent P1</div><div className="stat-value" style={{color:'var(--red)'}}>{p1.length}</div></div>
      </div>
      {p1.length>0&&<div className="card" style={{borderColor:'rgba(248,113,113,0.25)',background:'rgba(248,113,113,0.04)',marginBottom:14}}>
        <div className="card-header" style={{marginBottom:8}}><span style={{fontSize:14,fontWeight:600,color:'var(--red)'}}>⚡ Urgent — get soon</span></div>
        {p1.map(i=>{const d=fmtDate(i.need_by);return(<div key={i.id} style={{display:'flex',gap:10,alignItems:'center',marginBottom:6,fontSize:13}}><span className="badge badge-p1">P1</span><strong>{i.name}</strong>{d&&<span style={{color:d.color}}>· {d.label}</span>}{i.price>0&&<span style={{color:'var(--green)'}}>~${i.price}</span>}{i.note&&<span style={{color:'var(--muted)',fontStyle:'italic'}}>"{i.note}"</span>}<span style={{color:'var(--muted)',marginLeft:'auto',fontSize:12}}>— {i.added_by}</span></div>);})}
      </div>}
      {pending.length>0&&<div style={{display:'flex',alignItems:'center',justifyContent:'space-between',background:'rgba(108,142,255,0.08)',border:'1px solid rgba(108,142,255,0.18)',borderRadius:'var(--radius)',padding:'12px 18px',marginBottom:16}}><div><div style={{fontSize:13,color:'var(--muted)'}}>Budget needed</div><div style={{fontSize:12,color:'var(--muted)'}}>{pending.length} items</div></div><div style={{fontSize:22,fontWeight:700,color:'var(--accent)'}}>${total.toFixed(0)}</div></div>}
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:12,flexWrap:'wrap',gap:8}}>
        <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
          {['all','P1','P2','P3','P4','pending','done'].map(f=>(
            <button key={f} onClick={()=>setFilter(f)} style={{padding:'4px 12px',borderRadius:100,fontSize:12,fontWeight:500,cursor:'pointer',border:'1px solid',borderColor:filter===f?'var(--accent)':'var(--border2)',background:filter===f?'var(--accent)':'transparent',color:filter===f?'#fff':'var(--muted)',transition:'all .15s'}}>
              {f==='all'?'All':f==='pending'?'Pending':f==='done'?'✓ Done':f}
            </button>
          ))}
        </div>
        <div style={{display:'flex',gap:8}}>
          {items.some(i=>i.done)&&<button className="btn btn-ghost btn-sm" onClick={()=>{if(window.confirm('Clear done items?'))api.clearDoneItems().then(load);}}>Clear done</button>}
          <button className="btn btn-primary btn-sm" onClick={()=>setShowForm(!showForm)}>+ Add Item</button>
        </div>
      </div>
      {showForm&&<div className="card" style={{borderColor:'var(--border2)',marginBottom:16}}>
        <div style={{fontWeight:600,fontSize:14,marginBottom:14}}>Add to shopping list</div>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10,marginBottom:10}}>
          <div className="form-group" style={{gridColumn:'1 / -1'}}><div className="form-label">Item name *</div><input placeholder="e.g. School pants size 10" value={form.name} onChange={e=>setForm({...form,name:e.target.value})} autoFocus/></div>
          <div className="form-group"><div className="form-label">Added by</div><select value={form.added_by} onChange={e=>setForm({...form,added_by:e.target.value})}>{members.map(m=><option key={m.id}>{m.name}</option>)}</select></div>
          <div className="form-group"><div className="form-label">Priority</div><select value={form.priority} onChange={e=>setForm({...form,priority:e.target.value})}><option value="P1">P1 — Urgent</option><option value="P2">P2 — Soon</option><option value="P3">P3 — Whenever</option><option value="P4">P4 — Wishlist</option></select></div>
          <div className="form-group"><div className="form-label">Need by</div><input type="date" value={form.need_by} onChange={e=>setForm({...form,need_by:e.target.value})}/></div>
          <div className="form-group"><div className="form-label">Est. price ($)</div><input type="number" placeholder="0" value={form.price} onChange={e=>setForm({...form,price:e.target.value})}/></div>
          <div className="form-group"><div className="form-label">Category</div><select value={form.category} onChange={e=>setForm({...form,category:e.target.value})}>{CATS.map(c=><option key={c}>{c}</option>)}</select></div>
          <div className="form-group" style={{gridColumn:'1 / -1'}}><div className="form-label">Note</div><input placeholder="e.g. Need for Monday, size medium" value={form.note} onChange={e=>setForm({...form,note:e.target.value})}/></div>
        </div>
        <div style={{display:'flex',gap:8}}>
          <button className="btn btn-primary" onClick={submit} disabled={saving||!form.name.trim()}>{saving?'Saving...':'+ Add to list'}</button>
          <button className="btn btn-ghost" onClick={()=>setShowForm(false)}>Cancel</button>
        </div>
      </div>}
      {filtered.length===0?<div className="empty"><div className="empty-icon">🛒</div><p>No items yet</p></div>:
        filtered.map(item=>{
          const mem=getMember(item.added_by);
          const d=fmtDate(item.need_by);
          return(<div key={item.id} style={{display:'flex',alignItems:'center',gap:12,padding:'11px 14px',background:'var(--bg2)',border:`1px solid ${item.done?'var(--border)':'var(--border2)'}`,borderRadius:'var(--radius-sm)',marginBottom:7,opacity:item.done?.5:1,transition:'all .15s'}}>
            <div onClick={()=>toggle(item.id)} style={{width:20,height:20,borderRadius:5,flexShrink:0,cursor:'pointer',border:`2px solid ${item.done?'var(--green)':'var(--border2)'}`,background:item.done?'var(--green)':'transparent',display:'flex',alignItems:'center',justifyContent:'center',transition:'all .15s',fontSize:11,color:'#0f1117',fontWeight:700}}>{item.done&&'✓'}</div>
            <div style={{flex:1,minWidth:0}}>
              <div style={{fontSize:14,fontWeight:500,textDecoration:item.done?'line-through':'none',marginBottom:3}}>{item.name}</div>
              <div style={{display:'flex',alignItems:'center',gap:8,flexWrap:'wrap',fontSize:12,color:'var(--muted)'}}>
                <span className={`badge ${PCLS[item.priority]}`}>{item.priority} · {PLABEL[item.priority]}</span>
                {d&&<span style={{color:d.color}}>📅 {d.label}</span>}
                {item.price>0&&<span style={{color:'var(--green)'}}>~${item.price}</span>}
                {item.category!=='General'&&<span>{item.category}</span>}
                {item.note&&<span style={{fontStyle:'italic'}}>"{item.note}"</span>}
              </div>
            </div>
            <div style={{display:'flex',alignItems:'center',gap:6,flexShrink:0}}><Av member={mem} size={24}/><span style={{fontSize:12,color:'var(--muted)'}}>{item.added_by}</span></div>
            <button className="btn btn-danger btn-sm" style={{padding:'5px 8px'}} onClick={()=>del(item.id)}>✕</button>
          </div>);
        })
      }
    </div>
  );
}

function Dashboard({members,setPage}){
  const [items,setItems]=useState([]);
  const [events,setEvents]=useState([]);
  const [messages,setMessages]=useState([]);
  useEffect(()=>{
    api.getShopping().then(setItems).catch(()=>{});
    const today=new Date().toISOString().split('T')[0];
    const end=new Date(Date.now()+30*86400000).toISOString().split('T')[0];
    api.getEvents(today,end).then(setEvents).catch(()=>{});
    api.getMessages(4).then(setMessages).catch(()=>{});
  },[]);
  const pending=items.filter(i=>!i.done);
  const p1=pending.filter(i=>i.priority==='P1');
  const total=pending.reduce((s,i)=>s+(parseFloat(i.price)||0),0);
  const getMember=name=>members.find(m=>m.name===name);
  return(
    <div className="page">
      <div className="page-title">Welcome home 🏠</div>
      <div className="page-sub">{new Date().toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'})}</div>
      <div className="stats">
        <div className="stat"><div className="stat-label">Shopping</div><div className="stat-value" style={{color:'var(--accent)'}}>{pending.length}</div></div>
        <div className="stat"><div className="stat-label">Urgent P1</div><div className="stat-value" style={{color:p1.length>0?'var(--red)':'var(--green)'}}>{p1.length}</div></div>
        <div className="stat"><div className="stat-label">Est. Budget</div><div className="stat-value" style={{color:'var(--green)'}}>${total.toFixed(0)}</div></div>
      </div>
      {p1.length>0&&<div className="card" style={{borderColor:'rgba(248,113,113,0.25)',background:'rgba(248,113,113,0.04)'}}>
        <div className="card-header"><span style={{fontWeight:600,color:'var(--red)'}}>⚡ Needs attention</span><button className="btn btn-ghost btn-sm" onClick={()=>setPage('shopping')}>View all</button></div>
        {p1.slice(0,4).map(i=><div key={i.id} style={{display:'flex',gap:10,alignItems:'center',marginBottom:6,fontSize:13}}><span className="badge badge-p1">P1</span><span style={{fontWeight:500}}>{i.name}</span>{i.need_by&&<span style={{color:'var(--muted)',fontSize:12}}>by {i.need_by}</span>}{i.price>0&&<span style={{color:'var(--green)',marginLeft:'auto'}}>~${i.price}</span>}</div>)}
      </div>}
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:14}}>
        <div className="card">
          <div className="card-header"><div className="card-title">📅 Upcoming</div></div>
          {events.length===0?<div style={{color:'var(--muted)',fontSize:13}}>No upcoming events</div>:events.slice(0,5).map(e=><div key={e.id} style={{display:'flex',gap:8,alignItems:'center',marginBottom:8}}><div style={{width:8,height:8,borderRadius:'50%',background:e.color,flexShrink:0}}></div><div style={{flex:1,fontSize:13,fontWeight:500}}>{e.title}</div><span style={{fontSize:11,color:'var(--muted)'}}>{e.date.slice(5)}</span></div>)}
        </div>
        <div className="card">
          <div className="card-header"><div className="card-title">💬 Messages</div></div>
          {messages.length===0?<div style={{color:'var(--muted)',fontSize:13}}>No messages yet</div>:messages.slice(-3).map(m=>{const mem=getMember(m.member_name);return(<div key={m.id} style={{display:'flex',gap:8,alignItems:'flex-start',marginBottom:8}}><div className="avatar" style={{width:22,height:22,fontSize:9,fontWeight:700,flexShrink:0,background:(mem?.color||'#6c8eff')+'25',color:mem?.color||'#6c8eff',border:`1.5px solid ${(mem?.color||'#6c8eff')}40`}}>{mem?.initials||'?'}</div><div style={{flex:1,minWidth:0}}><span style={{fontSize:12,fontWeight:600,color:mem?.color||'var(--text)'}}>{m.member_name}: </span><span style={{fontSize:12,color:'var(--muted)'}}>{m.text.length>50?m.text.slice(0,50)+'…':m.text}</span></div></div>);})}
        </div>
      </div>
      <div className="card" style={{background:'rgba(108,142,255,0.04)',borderColor:'rgba(108,142,255,0.12)'}}>
        <div className="card-title" style={{marginBottom:10}}>👨‍👩‍👧‍👦 Family Members</div>
        <div style={{display:'flex',gap:12,flexWrap:'wrap'}}>
          {members.map(m=><div key={m.id} style={{display:'flex',alignItems:'center',gap:8,padding:'6px 12px',background:m.color+'15',border:`1px solid ${m.color}30`,borderRadius:100}}><div className="avatar" style={{width:26,height:26,fontSize:10,fontWeight:700,background:m.color+'25',color:m.color,border:`1.5px solid ${m.color}50`}}>{m.initials}</div><span style={{fontSize:13,fontWeight:500}}>{m.name}</span></div>)}
        </div>
      </div>
    </div>
  );
}

function Messages({members}){
  const [messages,setMessages]=useState([]);
  const [input,setInput]=useState('');
  const [asUser,setAsUser]=useState(null);
  const [sending,setSending]=useState(false);
  const lastIdRef=useRef(0);
  const endRef=useRef(null);
  useEffect(()=>{if(members.length&&!asUser)setAsUser(members[0]);},[members,asUser]);
  const load=useCallback(async()=>{try{const msgs=await api.getMessages(50);setMessages(msgs);if(msgs.length)lastIdRef.current=Math.max(...msgs.map(m=>m.id));}catch(e){}},[]);
  useEffect(()=>{load();},[load]);
  useEffect(()=>{const t=setInterval(async()=>{if(lastIdRef.current===0)return;try{const nm=await api.getMessagesSince(lastIdRef.current);if(nm.length){setMessages(prev=>[...prev,...nm]);lastIdRef.current=Math.max(...nm.map(m=>m.id));}}catch(e){}},5000);return()=>clearInterval(t);},[]);
  useEffect(()=>{endRef.current?.scrollIntoView({behavior:'smooth'});},[messages]);
  const send=async()=>{
    if(!input.trim()||!asUser||sending)return;
    setSending(true);const text=input.trim();setInput('');
    try{const msg=await api.postMessage({member_id:asUser.id,member_name:asUser.name,text});setMessages(prev=>[...prev,msg]);lastIdRef.current=msg.id;}catch(e){setInput(text);}
    setSending(false);
  };
  const getMember=name=>members.find(m=>m.name===name);
  const fmtTime=ts=>new Date(ts).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
  return(
    <div className="page">
      <div className="page-title">Family Chat</div>
      <div className="page-sub">Syncs every 5 seconds across all devices</div>
      <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:16,padding:'10px 14px',background:'var(--bg2)',borderRadius:'var(--radius-sm)',border:'1px solid var(--border)'}}>
        <span style={{fontSize:12,color:'var(--muted)',flexShrink:0}}>Chatting as:</span>
        {members.map(m=><div key={m.id} onClick={()=>setAsUser(m)} style={{display:'flex',alignItems:'center',gap:6,padding:'4px 10px',borderRadius:100,cursor:'pointer',border:`1.5px solid ${asUser?.id===m.id?m.color:'transparent'}`,background:asUser?.id===m.id?m.color+'20':'transparent',transition:'all .15s'}}>
          <div className="avatar" style={{width:22,height:22,fontSize:9,fontWeight:700,background:m.color+'30',color:m.color,border:`1.5px solid ${m.color}50`}}>{m.initials}</div>
          <span style={{fontSize:13,fontWeight:asUser?.id===m.id?600:400,color:asUser?.id===m.id?m.color:'var(--muted)'}}>{m.name}</span>
        </div>)}
      </div>
      <div style={{background:'var(--bg2)',border:'1px solid var(--border)',borderRadius:'var(--radius)',padding:16,minHeight:360,maxHeight:480,overflowY:'auto',marginBottom:12}}>
        {messages.length===0?<div className="empty"><div className="empty-icon">💬</div><p>No messages yet</p></div>:
          messages.map(msg=>{
            const isMe=msg.member_name===asUser?.name;
            const mem=getMember(msg.member_name);
            return(<div key={msg.id} style={{display:'flex',gap:8,marginBottom:10,flexDirection:isMe?'row-reverse':'row',alignItems:'flex-end'}}>
              <div className="avatar" style={{width:28,height:28,fontSize:10,fontWeight:700,flexShrink:0,background:(mem?.color||'#6c8eff')+'25',color:mem?.color||'#6c8eff',border:`1.5px solid ${(mem?.color||'#6c8eff')}40`}}>{mem?.initials||'?'}</div>
              <div style={{maxWidth:'72%'}}>
                {!isMe&&<div style={{fontSize:11,color:mem?.color||'var(--muted)',marginBottom:3,fontWeight:600}}>{msg.member_name}</div>}
                <div style={{padding:'9px 13px',borderRadius:14,fontSize:13.5,lineHeight:1.5,background:isMe?'rgba(108,142,255,0.2)':'var(--bg3)',border:`1px solid ${isMe?'rgba(108,142,255,0.3)':'var(--border)'}`}}>{msg.text}</div>
                <div style={{fontSize:11,color:'var(--muted)',marginTop:3,textAlign:isMe?'right':'left'}}>{fmtTime(msg.created_at)}</div>
              </div>
            </div>);
          })
        }
        <div ref={endRef}></div>
      </div>
      <div style={{display:'flex',gap:10}}>
        <input style={{flex:1}} placeholder={asUser?`Message as ${asUser.name}...`:'Select who you are above'} value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>e.key==='Enter'&&send()} disabled={!asUser}/>
        <button className="btn btn-primary" onClick={send} disabled={!input.trim()||!asUser||sending}>{sending?'…':'Send →'}</button>
      </div>
    </div>
  );
}

function Calendar({members}){
  const [events,setEvents]=useState([]);
  const [cur,setCur]=useState(new Date());
  const [showForm,setShowForm]=useState(false);
  const [form,setForm]=useState({title:'',date:new Date().toISOString().split('T')[0],color:'#6c8eff',member:''});
  const yr=cur.getFullYear(),mo=cur.getMonth();
  const load=useCallback(()=>{const f=new Date(yr,mo-1,1).toISOString().split('T')[0];const t=new Date(yr,mo+2,0).toISOString().split('T')[0];api.getEvents(f,t).then(setEvents).catch(console.error);},[yr,mo]);
  useEffect(()=>{load();},[load]);
  const MN=['January','February','March','April','May','June','July','August','September','October','November','December'];
  const DN=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const first=new Date(yr,mo,1).getDay();
  const days=new Date(yr,mo+1,0).getDate();
  const cells=[];
  for(let i=0;i<first;i++)cells.push(null);
  for(let d=1;d<=days;d++)cells.push(d);
  const today=new Date();
  const isToday=d=>d===today.getDate()&&mo===today.getMonth()&&yr===today.getFullYear();
  const eventsForDay=d=>{const ds=`${yr}-${String(mo+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;return events.filter(e=>e.date===ds);};
  const add=async()=>{if(!form.title.trim()||!form.date)return;await api.addEvent(form);load();setForm({title:'',date:new Date().toISOString().split('T')[0],color:'#6c8eff',member:''});setShowForm(false);};
  const upcoming=events.filter(e=>e.date>=today.toISOString().split('T')[0]).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,6);
  const COLORS=['#6c8eff','#f472b6','#34d399','#fbbf24','#fb7185','#a78bfa'];
  return(
    <div className="page">
      <div className="page-title">Calendar</div>
      <div className="page-sub">Family events and important dates</div>
      {showForm&&<div className="card" style={{marginBottom:16}}>
        <div style={{fontWeight:600,fontSize:14,marginBottom:12}}>Add event</div>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10,marginBottom:10}}>
          <div className="form-group" style={{gridColumn:'1 / -1'}}><div className="form-label">Title</div><input placeholder="e.g. Soccer game" value={form.title} onChange={e=>setForm({...form,title:e.target.value})} autoFocus/></div>
          <div className="form-group"><div className="form-label">Date</div><input type="date" value={form.date} onChange={e=>setForm({...form,date:e.target.value})}/></div>
          <div className="form-group"><div className="form-label">Member</div><select value={form.member} onChange={e=>{const m=members.find(m=>m.name===e.target.value);setForm({...form,member:e.target.value,color:m?.color||form.color});}}><option value="">All family</option>{members.map(m=><option key={m.id}>{m.name}</option>)}</select></div>
        </div>
        <div style={{marginBottom:12}}><div className="form-label" style={{marginBottom:6}}>Color</div><div style={{display:'flex',gap:8}}>{COLORS.map(c=><div key={c} onClick={()=>setForm({...form,color:c})} style={{width:24,height:24,borderRadius:'50%',background:c,cursor:'pointer',border:form.color===c?'3px solid #fff':'3px solid transparent'}}/>)}</div></div>
        <div style={{display:'flex',gap:8}}><button className="btn btn-primary" onClick={add} disabled={!form.title.trim()}>+ Add</button><button className="btn btn-ghost" onClick={()=>setShowForm(false)}>Cancel</button></div>
      </div>}
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:14}}>
        <div style={{display:'flex',alignItems:'center',gap:12}}>
          <button className="btn btn-ghost btn-sm" onClick={()=>setCur(new Date(yr,mo-1,1))}>← Prev</button>
          <span style={{fontSize:17,fontWeight:700}}>{MN[mo]} {yr}</span>
          <button className="btn btn-ghost btn-sm" onClick={()=>setCur(new Date(yr,mo+1,1))}>Next →</button>
        </div>
        <button className="btn btn-primary btn-sm" onClick={()=>setShowForm(!showForm)}>+ Add Event</button>
      </div>
      <div className="card" style={{padding:14}}>
        <div style={{display:'grid',gridTemplateColumns:'repeat(7,1fr)',gap:2,marginBottom:4}}>{DN.map(d=><div key={d} style={{textAlign:'center',fontSize:11,fontWeight:600,color:'var(--muted)',padding:'4px 0',textTransform:'uppercase'}}>{d}</div>)}</div>
        <div style={{display:'grid',gridTemplateColumns:'repeat(7,1fr)',gap:2}}>
          {cells.map((day,i)=>{
            const de=day?eventsForDay(day):[];
            return(<div key={i} style={{minHeight:52,padding:'5px 4px',borderRadius:7,fontSize:13,background:day&&isToday(day)?'rgba(108,142,255,0.15)':'transparent',border:`1px solid ${day&&isToday(day)?'rgba(108,142,255,0.35)':'transparent'}`,color:day&&isToday(day)?'var(--accent)':day?'var(--text)':'transparent',fontWeight:day&&isToday(day)?700:400}}>
              {day&&<><div style={{textAlign:'center',marginBottom:3}}>{day}</div><div style={{display:'flex',flexWrap:'wrap',gap:2,justifyContent:'center'}}>{de.slice(0,3).map(e=><div key={e.id} style={{width:6,height:6,borderRadius:'50%',background:e.color}} title={e.title}/>)}</div></>}
            </div>);
          })}
        </div>
      </div>
      <div style={{fontWeight:600,fontSize:14,marginBottom:10}}>Upcoming</div>
      {upcoming.length===0?<div className="empty"><div className="empty-icon">📅</div><p>No upcoming events</p></div>:
        upcoming.map(e=><div key={e.id} style={{display:'flex',alignItems:'center',gap:12,padding:'10px 14px',background:'var(--bg2)',border:'1px solid var(--border)',borderRadius:'var(--radius-sm)',marginBottom:6}}>
          <div style={{width:10,height:10,borderRadius:'50%',background:e.color,flexShrink:0}}></div>
          <div style={{flex:1}}><div style={{fontSize:14,fontWeight:500}}>{e.title}</div><div style={{fontSize:12,color:'var(--muted)'}}>{new Date(e.date+'T00:00:00').toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'})}{e.member&&` · ${e.member}`}</div></div>
          <button className="btn btn-danger btn-sm" style={{padding:'5px 8px'}} onClick={()=>api.deleteEvent(e.id).then(load)}>✕</button>
        </div>)
      }
    </div>
  );
}

function Settings({members,setMembers}){
  const [newM,setNewM]=useState({name:'',initials:'',color:'#6c8eff'});
  const [show,setShow]=useState(false);
  const [saved,setSaved]=useState(false);
  const [settings,setSettings]=useState({});
  useEffect(()=>{api.getSettings().then(setSettings).catch(()=>{});},[]);
  const COLORS=['#6c8eff','#f472b6','#34d399','#fbbf24','#fb7185','#a78bfa','#38bdf8','#fb923c'];
  const add=async()=>{if(!newM.name||!newM.initials)return;const m=await api.addMember(newM);setMembers(prev=>[...prev,m]);setNewM({name:'',initials:'',color:'#6c8eff'});setShow(false);api.getMembers().then(setMembers);};
  const del=async(id)=>{if(!window.confirm('Remove?'))return;await api.deleteMember(id);setMembers(prev=>prev.filter(m=>m.id!==id));};
  const save=async()=>{await api.saveSettings(settings);setSaved(true);setTimeout(()=>setSaved(false),2000);};
  return(
    <div className="page">
      <div className="page-title">Settings</div>
      <div className="page-sub">Manage family members and preferences</div>
      <div className="card">
        <div className="card-header"><div className="card-title">👨‍👩‍👧‍👦 Family Members</div><button className="btn btn-primary btn-sm" onClick={()=>setShow(!show)}>+ Add</button></div>
        {show&&<div style={{background:'var(--bg3)',borderRadius:'var(--radius-sm)',padding:14,marginBottom:14}}>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10,marginBottom:10}}>
            <div className="form-group"><div className="form-label">Name</div><input placeholder="e.g. Jordan" value={newM.name} onChange={e=>setNewM({...newM,name:e.target.value})}/></div>
            <div className="form-group"><div className="form-label">Initials</div><input placeholder="JO" maxLength="2" value={newM.initials} onChange={e=>setNewM({...newM,initials:e.target.value.toUpperCase()})}/></div>
          </div>
          <div className="form-label" style={{marginBottom:6}}>Color</div>
          <div style={{display:'flex',gap:8,marginBottom:12}}>{COLORS.map(c=><div key={c} onClick={()=>setNewM({...newM,color:c})} style={{width:24,height:24,borderRadius:'50%',background:c,cursor:'pointer',border:newM.color===c?'3px solid #fff':'3px solid transparent'}}/>)}</div>
          <div style={{display:'flex',gap:8}}><button className="btn btn-primary btn-sm" onClick={add} disabled={!newM.name||!newM.initials}>Add</button><button className="btn btn-ghost btn-sm" onClick={()=>setShow(false)}>Cancel</button></div>
        </div>}
        {members.map(m=><div key={m.id} style={{display:'flex',alignItems:'center',gap:12,padding:'10px 0',borderBottom:'1px solid var(--border)'}}>
          <div className="avatar" style={{width:36,height:36,fontSize:13,fontWeight:700,background:m.color+'25',color:m.color,border:`2px solid ${m.color}40`}}>{m.initials}</div>
          <div style={{flex:1}}><div style={{fontWeight:600}}>{m.name}</div></div>
          <button className="btn btn-danger btn-sm" onClick={()=>del(m.id)}>Remove</button>
        </div>)}
      </div>
      <div className="card">
        <div className="card-header"><div className="card-title">⚙️ Preferences</div></div>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10,marginBottom:14}}>
          <div className="form-group"><div className="form-label">Family Name</div><input placeholder="The Smith Family" value={settings.family_name||''} onChange={e=>setSettings({...settings,family_name:e.target.value})}/></div>
          <div className="form-group"><div className="form-label">Paycheck day</div><select value={settings.paycheck_day||'15'} onChange={e=>setSettings({...settings,paycheck_day:e.target.value})}>{Array.from({length:31},(_,i)=>i+1).map(d=><option key={d} value={d}>{d}</option>)}</select></div>
        </div>
        <button className="btn btn-primary" onClick={save}>{saved?'✓ Saved!':'Save Settings'}</button>
      </div>
    </div>
  );
}

function Sidebar({page,setPage,urgentCount}){
  const nav=[{id:'dashboard',label:'Dashboard',icon:'🏠'},{id:'shopping',label:'Shopping List',icon:'🛒',badge:urgentCount},{id:'calendar',label:'Calendar',icon:'📅'},{id:'messages',label:'Messages',icon:'💬'},{id:'settings',label:'Settings',icon:'⚙️'}];
  return(
    <div className="sidebar">
      <div className="logo"><div className="logo-icon">🏠</div>Family Hub</div>
      <div style={{flex:1,paddingTop:8}}>
        {nav.map(n=><div key={n.id} className={`nav-item ${page===n.id?'active':''}`} onClick={()=>setPage(n.id)}>
          <span style={{fontSize:16}}>{n.icon}</span>{n.label}
          {n.badge>0&&<span className="nav-badge">{n.badge}</span>}
        </div>)}
      </div>
      <div style={{padding:'14px 16px',borderTop:'1px solid var(--border)',fontSize:11,color:'var(--muted)',lineHeight:1.6}}>
        P1=Urgent · P2=Soon<br/>P3=Whenever · P4=Wishlist
      </div>
    </div>
  );
}

function App(){
  const [page,setPage]=useState('dashboard');
  const [members,setMembers]=useState([]);
  const [urgentCount,setUrgentCount]=useState(0);
  useEffect(()=>{api.getMembers().then(setMembers).catch(console.error);},[]);
  useEffect(()=>{const check=()=>{api.getShopping().then(items=>{setUrgentCount(items.filter(i=>!i.done&&i.priority==='P1').length);}).catch(()=>{});};check();const t=setInterval(check,30000);return()=>clearInterval(t);},[]);
  const pages={dashboard:Dashboard,shopping:Shopping,calendar:Calendar,messages:Messages,settings:Settings};
  const P=pages[page]||Dashboard;
  return(
    <div className="app">
      <Sidebar page={page} setPage={setPage} urgentCount={urgentCount}/>
      <div className="main"><P members={members} setMembers={setMembers} setPage={setPage}/></div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
